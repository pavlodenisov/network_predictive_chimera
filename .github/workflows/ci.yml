name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Lint
        run: |
          python -m ruff check intelligence tests evals
          python -m ruff format --check intelligence tests evals
      - name: Type-check
        run: python -m mypy
      - name: Migrations round-trip
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests
        run: python -m pytest tests -q
      - name: Weekly demo pipeline
        run: |
          python -m intelligence.jobs.seed
          python -m intelligence.jobs.weekly --as-of 2026-09-06
      - name: Evals
        run: python -m evals.run all || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build
