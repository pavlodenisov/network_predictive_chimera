name: weekly-intelligence

# Runs the IDENTICAL entrypoint as `make weekly` — no separate cron logic (spec §47).
# Change the cadence by editing the one `cron:` line below.
on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:
    inputs:
      as_of:
        description: "Point-in-time date (YYYY-MM-DD); blank = today"
        required: false
        default: ""

concurrency:
  group: weekly-intelligence
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+pysqlite:///./chimera.db' }}
      CHIMERA_CODE_VERSION: ${{ github.sha }}
      CHIMERA_LOG_FORMAT: json
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHIMERA_EXTRACTOR: ${{ secrets.CHIMERA_EXTRACTOR || 'rules' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Migrate
        run: python -m alembic upgrade head
      - name: Seed (only if the database is empty)
        run: python -m intelligence.jobs.seed
      - name: Run weekly pipeline
        run: |
          if [ -n "${{ github.event.inputs.as_of }}" ]; then
            python -m intelligence.jobs.weekly --as-of "${{ github.event.inputs.as_of }}"
          else
            python -m intelligence.jobs.weekly
          fi
      - name: Upload digest
        if: always()
        run: python -m intelligence.jobs.weekly --digest-only > digest.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-digest
          path: digest.txt
