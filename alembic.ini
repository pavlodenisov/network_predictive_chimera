# Alembic configuration. The DB URL is injected from intelligence.config at runtime
# (see db/migrations/env.py) — do not hard-code it here.

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# sqlalchemy.url is set programmatically in env.py from DATABASE_URL.

[post_write_hooks]
# Format only — never --fix migrations (autogen references custom types that a
# lint autofix can misread). Full lint is `make lint`.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ./.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
