# Production-shaped local stack: web + api + PostgreSQL.
#
# `docker compose up --build` brings the whole thing up against Postgres 16:
#   web  -> http://localhost:3000     api -> http://localhost:8000/docs
# The default native dev workflow (no Docker) still runs against SQLite — see README.
# For a hosted one-click deploy use render.yaml (docs/DEPLOY_RENDER.md).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chimera
      POSTGRES_PASSWORD: chimera
      POSTGRES_DB: chimera
    ports:
      - "5432:5432"
    volumes:
      - chimera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimera"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://chimera:chimera@db:5432/chimera
      CHIMERA_CORS_ORIGINS: http://localhost:3000
      CHIMERA_CODE_VERSION: ${CHIMERA_CODE_VERSION:-compose}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHIMERA_EXTRACTOR: ${CHIMERA_EXTRACTOR:-rules}
    depends_on:
      db:
        condition: service_healthy
    # scripts/bootstrap_demo.py: migrate -> seed -> one week-2 pipeline pass -> uvicorn
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  chimera_pgdata:
