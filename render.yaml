# Render Blueprint — one deploy brings up the API, a Postgres database, and the web UI.
# https://render.com/docs/blueprint-spec
#
#   Render dashboard -> New -> Blueprint -> connect this repo -> Apply.
#
# Everything is wired automatically: chimera-web's API base URL is injected from
# chimera-api (fromService), so there is NO manual env-var step. Just Apply and wait.
#
# Free-tier notes:
#   * web services sleep after ~15 min idle (first request after that: ~30-60s cold start)
#   * Render's free Postgres is deleted ~30 days after creation. For an indefinitely-free
#     database, swap `chimera-db` for a free Neon instance — see docs/DEPLOY_RENDER.md.

databases:
  - name: chimera-db
    plan: free
    databaseName: chimera
    user: chimera

services:
  - type: web
    name: chimera-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chimera-db
          property: connectionString
      - key: CHIMERA_CORS_ORIGINS
        value: "*" # first-version demo; tighten to the web URL once SSO is in front
      - key: CHIMERA_EXTRACTOR
        value: rules # deterministic; set `claude` + add ANTHROPIC_API_KEY to enable the LLM path
      - key: CHIMERA_LOG_FORMAT
        value: json
      - key: ANTHROPIC_API_KEY
        sync: false # optional
      - key: TAVILY_API_KEY
        sync: false # optional — enables WebSearchSource; unset = cleanly disabled

  - type: web
    name: chimera-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    autoDeploy: true
    envVars:
      # RUNTIME var — the Next.js server proxies /api/be/* to this URL (no CORS, no
      # build-time baking). `fromService` on a Render *web* service returns only the
      # private host (no domain, no port), which doesn't resolve for an external proxy —
      # so this is the explicit public URL of chimera-api.
      #
      # A FRESH blueprint deploy gets a different random suffix: after the first deploy,
      # set this to the actual chimera-api URL (chimera-web → Environment), or use private
      # networking: swap to  fromService: {name: chimera-api, type: web, property: hostport}
      # and the proxy will call it over http:// internally.
      - key: API_BASE_URL
        value: https://chimera-api-8q5r.onrender.com
